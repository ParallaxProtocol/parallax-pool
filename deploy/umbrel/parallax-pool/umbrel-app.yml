manifestVersion: 1
id: parallax-pool
storage:
  dataRoot: data
category: crypto
name: Parallax Pool
version: "0.1.0"
tagline: Solo mine Parallax (LAX) with your own node
description: >-
  After installing, open the app and enter the LAX address that should receive your block rewards.
  Then point your GPU miners at your Umbrel on port 4073.


  Parallax Pool runs a Parallax node and an XHash mining pool on your Umbrel. Your miners work on blocks
  from your own node, and every block they find pays its full reward straight to your address: no pool
  operator, no fees, no keys stored on the device. Rewards unlock after 100 blocks, about 17 hours.


  The dashboard shows your hashrate, how often you can expect a block at that rate, every worker, the
  blocks you found and how long until their rewards unlock. The Connect page builds the command for
  Hashwarp, the Parallax GPU miner.


  The node downloads the Parallax chain on first start; mining begins once it is in sync.
releaseNotes: ""

developer: Parallax Protocol
website: https://parallaxprotocol.org
dependencies: []
repo: https://github.com/ParallaxProtocol/parallax-pool
support: https://github.com/ParallaxProtocol/parallax-pool/issues

port: 3473
gallery: []
path: ""

defaultUsername: ""
defaultPassword: ""

widgets:
  - id: "stats"
    type: "four-stats"
    refresh: "30s"
    endpoint: "pool:4000/api/widgets/summary"
    link: ""
    example:
      type: "four-stats"
      link: ""
      items:
        - title: "Status"
          text: "Mining"
        - title: "Hashrate"
          text: "48.2"
          subtext: "MH/s"
        - title: "Blocks found"
          text: "3"
        - title: "Block height"
          text: "60,284"

backupIgnore:
  - data/node/*

submitter: Parallax Protocol
submission: ""
